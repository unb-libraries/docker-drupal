# Deny access to non-public files in the Drupal webroot.
# Included in app.conf's server block before the PHP location, so these
# regex locations match first. nginx ignores Drupal's .htaccess rules.

# Composer tree and build scripts: never serve or execute.
location ^~ /vendor/ { return 404; }
location ^~ /scripts/ { return 404; }

# Package manifests and lockfiles (root, core, contrib).
location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|web\.config)$ {
  return 404;
}

# Drupal source/config files (mirrors core .htaccess FilesMatch).
location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml)(~|\.sw[op]|\.bak|\.orig|\.save)?$ {
  return 404;
}

# Version-disclosing text files.
location ~* ^/(core/)?(CHANGELOG|COPYRIGHT|INSTALL.*|LICENSE|MAINTAINERS|UPGRADE)\.txt$ {
  return 404;
}

# No PHP execution from public/private files or nested dotted paths.
location ~ ^/sites/[^/]+/files/.*\.php$ { return 404; }
location ~ ^/sites/.*/private/ { return 404; }
location ~ \..*/.*\.php$ { return 404; }
