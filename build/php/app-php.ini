; Drupal-specific PHP overrides, installed as zz_drupal.ini (loads after the
; nginx-php canonical zz_app.ini). Keep ONLY values that differ from the base
; image; logging keys and [Date] are inherited from zz_app.ini.
[PHP]
max_execution_time = 30
memory_limit = 1024M
post_max_size = 256M
realpath_cache_size=4096K
realpath_cache_ttl=600
sendmail_path = "/usr/sbin/sendmail -t -i -f libsupport@unb.ca"
upload_max_filesize = 256M
